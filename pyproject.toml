[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossjit-generator"
version = "0.1.0.dev0"
description = "Build-time Provider execution synthesis for Host-proven CrossJIT regions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CrossJIT contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["crossjit_generator*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
